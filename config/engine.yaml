# 매매 엔진 운영 파라미터. 시각표와 주기를 코드에 쓰지 않는다 (CLAUDE.md 1)
#
# 전략 파라미터가 아니다. 손절폭·진입금액 같은 것은 strategy_*.yaml 에,
# 한도는 limits.yaml 에 있다. 여기 있는 것은 '언제 무엇을 하는가' 뿐이다.

swing:
  # 프로세스 이름. heartbeat·command·event_log 가 이 값으로 묶인다
  process_name: engine-swing

  # 굴릴 계좌. accounts.yaml 의 키다.
  # Phase 8 은 모의투자, Phase 9 에서 swing 으로 바꾼다
  account_id: paper

  # 전략. 백테스트 CLI 와 같은 이름을 쓴다 (config/strategy_{이름}.yaml).
  # 포털도 이 값으로 signal 을 조회하므로 두 곳에 적지 않는다
  strategy: swing

  # 루프 틱(초). command 폴링 주기이기도 하다.
  #
  # **비상 중단 버튼의 반응 속도가 이 값이다** (5단계). command 는 DB
  # 폴링이라 키움 API 유량(초당 1건)과 무관해서 짧게 둘 수 있다
  tick_sec: 10

  # heartbeat 주기(초). 화면이 생사를 보는 용도라 틱보다 길어도 된다.
  # telegram 수집기와 같은 값이고 portal.yaml 의 stale 임계값도 그 기준이다
  heartbeat_sec: 60

  # --- 하루 시간표 (KST) ---------------------------------------------
  #
  # 각 시각이 지나면 그날 한 번 실행된다. 틱이 10초라 정각을 놓치지 않는다.
  # 늦게 시작하거나 재시작해도 그날 아직 안 한 일은 실행된다.

  # 전날 19:00 에 남긴 계획을 **개장 정각에 시장가로** 제출한다.
  #
  # 원래 08:30 동시호가였다. **모의투자가 장시작전 주문을 받지 않는다**
  # (RC4057, 2026-09-01 실측). 09:00 으로 옮겼다.
  #
  # 실측이 이 선택을 뒷받침한다 (2026-09-02·09-03).
  #   09:00 정각 시장가 -> 그날 시가에 그대로 체결. 이틀 다 0.000%
  #   09:02 시장가      -> +0.298%, +0.197%
  #
  # **2분이 0.2~0.3% 다.** 백테스트가 '다음 날 시가 체결' 을 가정하므로
  # 정각에 내야 그 가정이 산다
  submit_time: "09:00"

  # 미체결 잔량을 취소한다. 백테스트에 미체결이라는 상태가 없다 —
  # 시가에 못 사면 주문을 버리는 _settle 과 같은 처리다.
  #
  # **15:30 이후에는 취소가 안 된다** (2026-09-03 실측). 15:31·15:45·16:10
  # 세 번 다 [2000](RC4058:모의투자 장종료) 로 거부됐다. 09:15 취소는
  # '모의투자 취소주문완료' 로 성공했으니 장중에는 된다.
  #
  # 15:20 부터 장 마감 동시호가라 그 전으로 잡는다. 백테스트는 어차피
  # 시가에만 체결하므로 20분 일찍 버려도 결과가 같다
  cancel_time: "15:10"

  # daily_pnl 스냅샷. 장 마감 동시호가(15:20~15:30) 체결이 브로커 잔고에
  # 반영될 여유를 둔다
  snapshot_time: "15:40"

  # scan·manage 를 돌려 다음 날 계획을 signal 에 남긴다.
  #
  # **일봉 수집기가 19:00 에 돈다.** 그 전에는 그날 종가가 price_daily 에
  # 없고, 백테스트와 같은 것을 봐야 하므로 (PROJECT.md 8.3) 그 뒤여야 한다
  plan_time: "19:00"

  # 각 일을 정각으로부터 몇 분 안에만 하는가.
  #
  # **창을 벗어난 일은 그날 건너뛴다.** done 이 프로세스 메모리에만 있어
  # 재시작하면 비는데, 창이 없으면 21:03 에 올라온 엔진이 09:00 제출을
  # 그때 해버린다. 2026-09-03 첫 기동에서 실제로 그랬다 — 계획 두 건이
  # 장종료로 거부되며 소진됐다.
  #
  # 다시 보기로 한 일(일봉 대기)에는 이 창을 적용하지 않는다
  task_window_min: 30

  # 일봉이 이보다 오래되면 그날 판단을 건너뛴다(일).
  #
  # **'오늘 일봉이 있는가' 로 판정하면 안 된다.** KRX 는 D일 데이터를 D+1 에
  # 공개하므로 19:00 수집기가 채우는 것은 어제 것이다. 오늘을 요구하면
  # 엔진이 매일 판단을 건너뛴다 (2026-09-03 확인).
  #
  # 정상은 하루. 월요일이면 금요일 종가라 사흘이다. 공휴일이 끼면 더 는다.
  # 수집기가 며칠 멈춘 것을 잡는 값이지 정상 지연을 잡는 값이 아니다
  plan_max_stale_days: 5

  # 계획 시각에 일봉이 아직 없을 때 몇 분 간격으로 다시 볼지, 몇 번까지.
  # 수집기가 늦어지는 것과 실패한 것을 구분할 방법이 이것뿐이다.
  # 다 써도 없으면 그날 판단을 건너뛴다 — '데이터가 없어서 안 샀다' 는
  # 안전한 실패다
  plan_retry_min: 20
  plan_retry_max: 6

  # 체결 추적을 시작할 시각. 끝은 cancel_time 이다.
  # submit_time 과 같은 시각이라 제출 직후부터 본다
  track_from: "09:00"

  # 체결 추적 간격(초). **틱마다 부르면 안 된다** — get_order_status 는
  # 목록 API 둘을 부르고 api-id 별 유량이 초당 1건이다 (2026-08-31 실측)
  fill_poll_sec: 60

  # 브로커 잔고와 position 이 어긋난 것으로 볼 수량 차이.
  # 0 이면 한 주만 달라도 진입을 막는다
  position_tolerance: 0
