# 계좌 정의와 자금 배분. 이 파일을 accounts.yaml 로 복사해 쓴다
#
#   cp config/accounts.example.yaml config/accounts.yaml
#
# 실제 계좌번호는 여기에 쓰지 않는다. .env 의 KIWOOM_ACCOUNT_* 에만 둔다.
# DB 백업 덤프에 평문으로 남는 것을 막기 위한 결정이다 (SCHEMA.md 1장).

accounts:
  # 단타. 분봉이 쌓인 뒤 Phase 10 에서 사용한다
  daytrade:
    broker: kiwoom
    strategy: daytrade
    is_paper: false
    currency: KRW
    is_active: false
    allocation: 0

  # 스윙 실전. Phase 9 소액 운용부터 활성화한다
  swing:
    broker: kiwoom
    strategy: swing
    is_paper: false
    currency: KRW
    is_active: false
    allocation: 0

  # 모의투자. 개발·검증용이라 지금부터 쓴다
  paper:
    broker: kiwoom
    strategy: swing
    is_paper: true
    currency: KRW
    is_active: true
    allocation: 0
