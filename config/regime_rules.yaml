# 시장국면 판정 규칙. 임계값을 코드에 쓰지 않는다 (CLAUDE.md 절대규칙 1)
#
# 2026-08-29 에 실측 분포의 10/90 분위수로 재조정했다.
# 이전 값(2026-08-28)은 85~99% 가 +-1 로 포화돼 사실상 이진 신호였다.
#
# **표본이 얇고 편향돼 있다.** 일간 지표는 254일, 월간은 11~12개월뿐이고
# 그 구간이 이례적인 강세장(이격도 중앙값 +36%, VKOSPI 중앙값 50)이다.
# 평범한 장이 오면 다시 어긋난다. 데이터가 쌓이면 또 조정한다.
#
# 바꿀 때 version 을 함께 올린다. market_regime.rule_version 으로
# 변경 전후를 구분한다 (ROADMAP Phase 3 주의사항).
#
# 계층 이름은 indicator.layer 값과 같다. INTERFACES.md 8.1 예시는
# fundamental / daily 두 계층이지만 그것은 형식 예시이고,
# 실제로는 SCHEMA.md 의 네 계층을 쓴다. layer_scores 가 지표 정의와 맞는다.
#
# thresholds 는 danger 쪽과 safe 쪽 값이다. 둘 사이를 선형으로 -1 ~ +1 에
# 대응시킨다. VKOSPI 처럼 값이 클수록 위험한 지표는 danger > safe 로 적는다.
#
# **양끝이 다 위험한 지표는 세 점으로 적는다** (2026-09-08 추가).
#   thresholds: { danger_low: 0.0, safe: 20.0, danger_high: 60.0 }
# safe 에서 +1, 양쪽 danger 에서 -1 인 삼각형이다. 이격도가 이 형식을 쓴다.
#
# metric 은 value(기본) 또는 change_rate 다.
# max_age_days 를 넘게 묵은 값은 없는 것으로 본다. 죽은 소스의 마지막 값이
# 영원히 판정에 남는 것을 막는다.

version: "2026-09-08"

layers:
  sentiment:
    weight: 0.35
    indicators:
      - code: DEPOSIT
        weight: 0.35
        metric: change_rate
        max_age_days: 5
        # 예탁금이 빠지면 위험. p10 -0.0335 / p90 0.0329
        thresholds: { danger: -0.034, safe: 0.033 }

      - code: CREDIT_BALANCE
        weight: 0.30
        metric: change_rate
        max_age_days: 5
        # 신용잔고는 늘수록 위험하다. danger 가 safe 보다 크다.
        # p90 0.0122 / p10 -0.0077
        thresholds: { danger: 0.012, safe: -0.008 }

      - code: FOREIGN_NET
        weight: 0.35
        max_age_days: 5
        # 단위는 억원 (indicator 표 정의). 순매수면 안전, 순매도면 위험.
        # p10 -44,381 / p90 21,890. 이 구간은 순매도 쪽으로 치우쳐 있다
        thresholds: { danger: -44000, safe: 22000 }

  risk:
    weight: 0.30
    indicators:
      - code: VKOSPI
        weight: 0.60
        max_age_days: 5
        # 변동성은 높을수록 위험하다. p90 84.35 / p10 20.98
        thresholds: { danger: 84.0, safe: 21.0 }

      - code: USDKRW
        weight: 0.40
        max_age_days: 5
        # 원화 약세가 위험 신호다. p90 1513.4 / p10 1392.7
        thresholds: { danger: 1513.0, safe: 1393.0 }

  position:
    weight: 0.20
    indicators:
      - code: KOSPI_MA200_GAP
        weight: 1.00
        max_age_days: 5
        # 이격도(%) = (종가 - MA200) / MA200 x 100.
        #
        # **세 점을 쓴다** (2026-09-08). 두 점이던 시절 규칙이 가장 중요한
        # 순간에 정확히 거꾸로였다.
        #
        #   2026-05  평균 68.1   옛 규칙 +1 (최대 안전)
        #   2026-06  평균 67.2   최고 82.8
        #   2026-07  평균 26.1   최저 -2.2   <- 무너졌다
        #   2026-09  평균 11.3   옛 규칙 -1 (최대 위험)
        #
        # 과열의 정점에서 안전을 외치고, 200일선 근처로 돌아온 뒤 위험이라
        # 했다. position 비중이 0.20 이라 전체 점수를 그만큼 반대로 밀었다.
        #
        # **값은 분위수가 아니다.** 표본 260일(2025-08~2026-09)이 이례적인
        # 강세장이라 중앙값 35.7% 를 '정상' 으로 박으면 그 1년을 정상이라고
        # 못 박는 것이 된다. 아래는 도메인 판단이다.
        #   0   200일선. 밑돌면 추세가 꺾인 것으로 본다
        #   20  200일선 위 20% 를 건강한 상승으로 본다
        #   60  이 위는 과열. 2026-05~06 이 이 구간이었다
        #
        # **임시값이다.** 200일선 아래 표본이 거의 없어(최저 -2.2%)
        # danger_low 는 근거가 아니라 판단이다. 데이터가 쌓이면 조정한다
        thresholds: { danger_low: 0.0, safe: 20.0, danger_high: 60.0 }

  fundamental:
    weight: 0.15
    indicators:
      - code: EXPORT_YOY
        weight: 0.60
        max_age_days: 60
        # p10 7.93 / p90 62.96. **표본이 12개월뿐이다**
        thresholds: { danger: 8.0, safe: 63.0 }

      - code: EXPORT_SEMI_YOY
        weight: 0.40
        max_age_days: 60
        # p10 21.57 / p90 166.29. **표본이 11개월뿐이다**
        thresholds: { danger: 22.0, safe: 166.0 }

output:
  danger_below: -0.3
  safe_above: 0.3
