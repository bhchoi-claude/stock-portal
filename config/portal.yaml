# 포털 화면·조회 파라미터. 숫자를 코드에 직접 쓰지 않는다

# 화면에 띄울 프로세스. 마지막 생존 신호가 stale_after_minutes 를 넘으면
# 멈춘 것으로 본다. 단위가 분인 이유는 상시 프로세스 때문이다.
# 하루 한 번 도는 배치는 하루보다 긴 값을, 상시 프로세스는 몇 분을 쓴다
processes:
  # 일 1회 유닛 (매일 19:00)
  - name: daily
    label: 일봉·조정 갱신
    stale_after_minutes: 1560   # 26시간
  - name: indicators
    label: 시장지표 수집
    stale_after_minutes: 1560   # 26시간
  - name: regime
    label: 국면 판정
    stale_after_minutes: 1560   # 26시간

  # 키움 유닛 (평일 16:10). 금요일에 돌고 월요일까지 72시간이 빈다.
  # 주말마다 화면이 빨개지지 않도록 그보다 길게 잡는다.
  # 배치가 실패하면 스스로 error 를 남기므로 이 임계값은
  # '아예 돌지 않았다' 만 잡는다
  - name: partitions
    label: 분봉 파티션
    stale_after_minutes: 4440   # 74시간
  - name: price_minute
    label: 분봉 수집
    stale_after_minutes: 4440   # 74시간
  - name: trading_flow
    label: 수급 수집
    stale_after_minutes: 4440   # 74시간
  - name: stock_flags
    label: 종목 상태 플래그
    stale_after_minutes: 4440   # 74시간

  # 상시 프로세스. 60초마다 신호를 남기므로 몇 분만 조용해도 이상하다
  - name: telegram
    label: 텔레그램 수집
    stale_after_minutes: 10
  - name: engine-swing
    label: 스윙 매매 엔진
    stale_after_minutes: 10

  # 10분마다 도는 배치. 한 번쯤 걸러도 이상하지 않게 여유를 둔다
  - name: news_analyze
    label: 정보수집 분석
    stale_after_minutes: 60

  - name: news_surge
    label: 키워드 집계
    stale_after_minutes: 60

  - name: dart
    label: 전자공시 수집
    stale_after_minutes: 60

# 목록에 없는 프로세스가 heartbeat 에 나타났을 때 쓴다.
# 설정에 추가하기 전에도 화면에서 사라지지 않게 한다
default_stale_after_minutes: 1560   # 26시간

# 국면 이력 조회 기본 구간
regime_history_days: 90

# 이벤트 조회 건수
events_limit_default: 50
events_limit_max: 500

# 정보수집 탭
keywords_limit: 60
messages_limit: 50
disclosures_limit: 30

# 원문 조회 기본 구간(일)
messages_days: 7

# 운영·로그 탭의 백테스트 실행 목록
backtest_runs_limit: 20
backtest_runs_max: 200

# 자동매매 탭. 계좌·전략·프로세스 이름은 config/engine.yaml 에서 읽는다.
# 여기 다시 적으면 두 곳이 어긋난다
trading:
  # 화면에 띄울 건수. 전부 상한일 뿐 성능 조절이 아니다.
  # 보유 종목에는 상한을 두지 않는다 — limits.yaml 의 max_positions 가 이미
  # 묶고 있고, 그보다 많아졌다면 그것이야말로 다 보여야 할 상황이다
  signals_limit: 20
  orders_limit: 30
  commands_limit: 10

  # 손익 추이를 며칠치 보여줄지
  pnl_days: 14
