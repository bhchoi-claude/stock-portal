# API·LLM 상한. 성능 조절이 아니라 폭주 방지다 (PROJECT.md 8.7)

llm:
  # 정보수집에서만 쓴다. 가벼운 모델로 충분하다 (PROJECT.md 9장)
  model: claude-haiku-4-5

  # 하루 이 금액을 넘으면 호출하지 않고 알린다.
  # 무한 루프로 같은 배치를 반복 호출하는 사고를 막는 값이다
  daily_cost_usd: 1.0

  # 1M 토큰당 단가(USD). 모델을 바꾸면 함께 바꾼다 (2026-06 기준)
  price_input_per_mtok: 1.0
  price_output_per_mtok: 5.0

  # 한 번에 묶어 보낼 원문 수. 단건 호출은 하지 않는다 (INTERFACES.md 7.1)
  batch_size: 20

  # 원문에서 잘라 보낼 최대 길이. 뒷부분은 대개 꼬리표와 인용이다
  max_chars: 1200

  max_output_tokens: 4000

backtest:
  # 키움 온라인 위탁수수료. **매수·매도에 각각** 붙는다.
  # 유관기관 제비용(KRX 기준 0.0036396%)이 이 안에 포함돼 있어 따로 더하지 않는다.
  # 수수료 할인 이벤트 계좌는 제비용이 별도 부과되어 실효 요율이 달라진다
  fee_rate: 0.00015

  # 증권거래세. **매도에만** 붙고 손익과 무관하게 매도금액 기준이다.
  # 2026-01-01 양도분부터 환원된 세율. 구성은 다르지만 합계는 같다
  #   코스피 0.05% + 농특세 0.15% = 0.20%
  #   코스닥 0.20%
  # 나중에 갈릴 수 있어 시장별로 나눠 둔다
  tax_rate:
    KOSPI: 0.0020
    KOSDAQ: 0.0020

  # 슬리피지. **실측 없이 정할 수 없어 보수적으로 잡은 임시값이다.**
  # Phase 8 모의투자에서 실제 체결가와 대조해 조정한다
  slippage_rate: 0.001

  # 백테스트 초기 자본. CLI 인자로 덮어쓸 수 있다
  initial_capital: 10000000

  # 커서 시각. 그날 종가가 확정되는 시점이다 (KST).
  # 신호는 이 시각에 계산되고 체결은 다음 거래일 시가에 일어난다
  close_time: "15:30"

  # 장 시작 시각(KST). 체결이 시가에 일어나므로 backtest_trade 의 시각이 이것이다
  open_time: "09:00"

  # 샤프 연율화에 쓸 연간 거래일 수. **근거가 아니라 관례다.**
  # 무위험수익률은 0 으로 본다. 바꾸면 숫자가 달라지므로 params 에 통째로 남는다
  days_per_year: 252

  # 유니버스 크기. 거래대금 상위 몇 종목까지 볼지.
  # **틀을 돌리는 데 필요한 최소값이다.** 확정은 Phase 7 (config/universe.yaml)
  universe_size: 200

risk:
  # 국면별 자금 배분 비율. **임시값이다.** 근거는 백테스트를 돌려야 생긴다.
  # Phase 3 국면 임계값과 같은 취급으로, 데이터가 쌓이면 조정한다
  regime_allocation:
    danger: 0.3
    neutral: 0.7
    safe: 1.0

  # 건당 최대 투입 금액(원)
  max_position_size: 1000000

  # 종목당 최대 비중. 총자산 대비
  max_weight_per_stock: 0.1

  # 동시 보유 종목 수
  max_positions: 10

  # 일일 손실 한도. 총자산 대비. 도달하면 당일 신규 진입을 중단한다.
  # **전략과 무관한 계층에서 강제한다** (INTERFACES.md 5장)
  daily_loss_limit: 0.03
