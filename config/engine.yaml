# 매매 엔진 운영 파라미터. 시각표와 주기를 코드에 쓰지 않는다 (CLAUDE.md 1)
#
# 전략 파라미터가 아니다. 손절폭·진입금액 같은 것은 strategy_*.yaml 에,
# 한도는 limits.yaml 에 있다. 여기 있는 것은 '언제 무엇을 하는가' 뿐이다.

swing:
  # 프로세스 이름. heartbeat·command·event_log 가 이 값으로 묶인다
  process_name: engine-swing

  # 굴릴 계좌. accounts.yaml 의 키다.
  # Phase 8 은 모의투자, Phase 9 에서 swing 으로 바꾼다
  account_id: paper

  # 루프 틱(초). command 폴링 주기이기도 하다.
  #
  # **비상 중단 버튼의 반응 속도가 이 값이다** (5단계). command 는 DB
  # 폴링이라 키움 API 유량(초당 1건)과 무관해서 짧게 둘 수 있다
  tick_sec: 10

  # heartbeat 주기(초). 화면이 생사를 보는 용도라 틱보다 길어도 된다.
  # telegram 수집기와 같은 값이고 portal.yaml 의 stale 임계값도 그 기준이다
  heartbeat_sec: 60

  # --- 하루 시간표 (KST) ---------------------------------------------
  #
  # 각 시각이 지나면 그날 한 번 실행된다. 틱이 10초라 정각을 놓치지 않는다.
  # 늦게 시작하거나 재시작해도 그날 아직 안 한 일은 실행된다.

  # 전날 19:00 에 남긴 계획을 장 시작 동시호가에 시장가로 제출한다.
  #
  # **09:00 이후에 내면 시가에 체결되지 않는다.** 백테스트가 '다음 날 시가
  # 체결' 을 가정하므로 08:30~09:00 동시호가에 넣어야 한다
  submit_time: "08:30"

  # 미체결 잔량을 취소한다. 백테스트에 미체결이라는 상태가 없다 —
  # 시가에 못 사면 주문을 버리는 _settle 과 같은 처리다
  cancel_time: "15:30"

  # daily_pnl 스냅샷. 장 마감 동시호가(15:20~15:30) 체결이 브로커 잔고에
  # 반영될 여유를 둔다
  snapshot_time: "15:40"

  # scan·manage 를 돌려 다음 날 계획을 signal 에 남긴다.
  #
  # **일봉 수집기가 19:00 에 돈다.** 그 전에는 그날 종가가 price_daily 에
  # 없고, 백테스트와 같은 것을 봐야 하므로 (PROJECT.md 8.3) 그 뒤여야 한다
  plan_time: "19:00"

  # 계획 시각에 일봉이 아직 없을 때 몇 분 간격으로 다시 볼지, 몇 번까지.
  # 수집기가 늦어지는 것과 실패한 것을 구분할 방법이 이것뿐이다.
  # 다 써도 없으면 그날 판단을 건너뛴다 — '데이터가 없어서 안 샀다' 는
  # 안전한 실패다
  plan_retry_min: 20
  plan_retry_max: 6

  # 브로커 잔고와 position 이 어긋난 것으로 볼 수량 차이.
  # 0 이면 한 주만 달라도 진입을 막는다
  position_tolerance: 0
