# 스윙 추세 추종 전략 파라미터. **검증 실패. 실전에 쓰지 않는다.**
#
# 개발 구간(2023-08~2025-08) 측정 결과 매매당 기대값 -1.60%, 총수익률 -34.38%.
# 아래 값은 초기 임시값 그대로다. **개발 구간에서 나은 값으로 바꾸지 않았다.**
# 검증 구간을 보지 않은 상태에서 바꾸면 검증된 값처럼 보이기 때문이다.
#
# 측정 사실 (개발 구간, 검증 안 됨)
#   stop_loss 0.07 -> -34.38%   0.15 -> -24.05%   0.99(끔) -> -47.02%
#   중간 최적점이 있다는 것은 진입 신호에 실제 우위가 있다는 뜻이다.

# 진입 — 둘 다 만족할 때
# 오늘 종가가 직전 이 일수의 최고가를 넘는다. 3개월 신고가
breakout_days: 60

# 종가가 이 이평 위에 있다. 6개월 추세가 위를 향한다는 뜻
ma_long: 120

# 청산 — 하나라도 걸리면
# 종가가 이 이평을 밑돌면 추세가 꺾인 것으로 본다.
# 추적 손절을 따로 두지 않는다. 이것이 이미 그 역할이다
ma_exit: 20

# 진입가 대비 손절폭. 이평 이탈은 느려서 갭하락을 못 막는다
stop_loss: 0.07

# 하루 신규 진입 후보 상한. 유니버스 순서(거래대금 상위)대로 채운다
entries_per_day: 5
