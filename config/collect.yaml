# 수집기 동작 파라미터. 숫자를 코드에 직접 쓰지 않는다

stock_master_backfill:
  # 과거 종목 스냅샷 간격(일). 상장 후 이 기간 안에 폐지되는 종목은 놓친다
  snapshot_interval_days: 7

  # 휴장일이면 0건이 온다. 데이터가 나올 때까지 하루씩 미는 최대 일수
  holiday_shift_days: 3

  # 직전 스냅샷보다 종목 수가 이 비율 넘게 줄면 중단한다.
  # API 이상 응답을 '전 종목 폐지' 로 오해하는 것을 막는 안전장치다
  max_shrink_ratio: 0.10

daily:
  # 며칠 전까지 되짚어 빠진 거래일을 찾을지. 연휴와 공개 지연을 덮을 만큼만
  lookback_days: 10

  # 가진 데이터보다 뒤에 있는 미적재 거래일이 이 일수를 넘으면 알린다.
  # KRX 는 당일 데이터를 다음 날 공개하므로 하루 이틀은 정상이다
  max_delay_days: 3

corporate_action:
  # 가격제한폭(±30%) 밖으로 움직인 날만 가격 조정 이벤트로 본다.
  # 권리락일에는 조정 후 기준가로 제한폭이 적용되므로 기계적 조정은 반드시 넘는다.
  # 자기주식 소각·전환사채 전환은 주식수만 바뀌고 가격은 제한폭 안에 있다
  price_jump_low: 0.65
  price_jump_high: 1.45

  # 감자·액면병합은 1/2, 1/5 처럼 단순 분수다. 주식수 비의 역수를 이 분모
  # 이하의 분수로 아래 오차 안에 표현할 수 있어야 가격 조정 대상으로 본다.
  # 인적분할과 자기주식 소각은 임의의 비율이 나오고, 그 비율은 가격 조정
  # 비율이 아니다. 적용하면 시계열이 오히려 더 틀어진다
  max_denominator: 4
  ratio_tolerance: 0.005

  # DART 발행일과 상장주식수 변경일이 며칠 어긋난다. 수량이 같고
  # 이 일수 안에 있는 이벤트를 같은 사건으로 본다
  dart_match_window_days: 45

adj_check:
  # 폐지일로부터 이 일수 안의 급변은 정리매매로 보고 세지 않는다.
  # 정리매매에는 가격제한폭이 없어 하루 -80% 가 정상이다.
  # 10일과 30일 사이에서 결과가 바뀌지 않는다 (2026-08-29 실측)
  liquidation_days: 20

price_minute:
  # 관심종목 수. 최근 거래일 거래대금 상위에서 고른다.
  # 키움 유량이 1 이라 1초에 한 종목씩이다. 200개면 약 3분 30초.
  # 한도를 보며 늘린다
  universe_size: 200

  interval: 1m

  # 한 종목당 받을 봉 수. 900봉이 약 2.3 거래일이라 하루 걸러도 따라잡는다
  count: 900

  # 실전 앱키가 없다. 시세 조회는 계좌와 무관하므로 모의로 받는다
  use_paper: true

trading_flow:
  # 상장 전 종목을 받는다. 일부만 받으면 시장 전체 수급 지표가 될 수 없다.
  # 키움 유량이 1 이라 종목당 1초, 약 2850종목이면 48분쯤 걸린다.
  # 한 번에 100 거래일이 오므로 매일 돌리면 과거분도 함께 메워진다

  # 실패한 종목 비율이 이 값을 넘으면 실패로 끝낸다.
  # 거래정지·신규상장으로 몇 건은 늘 실패한다. 한 건에 울리면 매일 알림이 온다
  max_failure_ratio: 0.02

  use_paper: true

stock_flags:
  # 응답이 상장중 종목의 이 비율에 못 미치면 중단한다.
  # 부분 응답을 '전 종목 관리종목 해제' 로 읽으면 이력이 통째로 틀어진다
  min_coverage_ratio: 0.95

  # 실전 앱키가 없다. 종목 상태 조회는 계좌와 무관하므로 모의로 받는다
  use_paper: true

partitions:
  # 이번 달부터 몇 개월치 분봉 파티션을 확보할지.
  # 배치가 몇 달 멈춰도 적재가 실패하지 않을 만큼 앞서 둔다
  months_ahead: 18

indicators:
  # 키움 업종코드. ka20003 으로 확인했다
  kospi_code: "001"
  kosdaq_code: "101"
  vkospi_code: "603"

  # 이격도 이동평균 구간(일). 지표 이름의 200 이 이 값이다
  ma_window: 200

  # 이 일수만큼 과거부터 적재한다. ka20006 이 600건을 주므로
  # 이동평균 구간을 빼고 남는 만큼이 상한이다
  backfill_days: 380

  # 수급 합계를 낼 때 이 비율만큼 종목이 모인 날만 쓴다.
  # 일부만 수집된 날의 합은 '시장 전체' 가 아니라 '받은 것들의 합' 이다
  min_flow_coverage_ratio: 0.9

  # 실전 앱키가 없다. 지수 조회는 계좌와 무관하므로 모의로 받는다
  use_paper: true

  # 금융투자협회·관세청·ECOS 지표
  kofia_rows: 400
  ecos_days: 400

  # 관세청은 월 단위다. 이 개월수만큼 거슬러 받는다.
  # 전년 동월 대비를 내려면 적재 구간보다 12개월 이상 더 받아야 한다
  customs_months: 36

  # HS 8542 는 집적회로다. 응답이 10자리 세부코드로 쪼개져 와서 합산한다
  semiconductor_hs: "8542"

  # ECOS 원달러 환율
  ecos_fx_stat: "731Y001"
  ecos_fx_item: "0000001"

news:
  # 처음 붙는 채널에서 받아올 과거 메시지 수. 그 뒤로는 마지막으로 받은
  # 번호 이후를 전부 따라잡으므로 이 값과 무관하다
  catch_up_limit: 200

  # 상시 프로세스라 살아 있다는 신호를 주기적으로 남긴다(초)
  heartbeat_sec: 60

  # 한 번에 분석할 원문 수
  batch_size: 500

  # 규칙 필터. 링크를 지운 뒤 남는 글자 수로 잰다.
  # 세게 자르면 '원전 2Q' 같은 짧은 테마 글이 통째로 사라진다.
  # 필터의 목적은 LLM 비용 절감인데 짧은 글은 원래 싸다 (2026-08-30 표본)
  min_length: 4

  # 채널마다 모든 글 끝에 붙는 홍보 꼬리.
  # 지우지 않으면 채널 이름이 매일 급등 키워드가 된다
  footers:
    - 📌그로쓰리서치 실시간 특징주 받기

  # 이 표현이 있으면 광고로 보고 분석하지 않는다.
  # 표본에서 뚜렷한 리딩방 광고가 없었다. 실측으로 채운다
  ad_patterns: []

  surge:
    # 급등 판정 임계값. **임시값이다.** 맞을 리가 없고 데이터가 쌓이면
    # 조정한다 (Phase 3 국면 임계값과 같은 취급이다)
    min_ratio: 3.0

    # 기준선이 이보다 낮으면 비율이 쉽게 튄다.
    # 하루 0.2회가 1회가 된 것을 5배 급등이라 부를 수 없다
    min_baseline: 1.0

    # 처음 나온 표현은 분모가 0이라 비율을 낼 수 없다. 건수로 잡는다
    new_min_count: 5

    # 며칠치를 다시 집계할지. 늦게 도착한 글과 동의어 병합을 반영한다
    rebuild_days: 3

  keyword:
    # 이 글자 수 미만의 키워드는 **사전에 있어도 매칭하지 않는다.**
    # 한 글자 한글 키워드는 낱말 경계 검사로도 못 막는다 — '금리' 는 '금'
    # 이 맨 앞이라 왼쪽 경계가 깨끗하고, 오른쪽은 조사와 구분이 안 돼
    # 볼 수 없다. 2026-09-01 에 '금' 이 하루 26회로 상위에 올랐다.
    #
    # 이미 사전에 들어간 것도 이 값으로 걸러진다. 지우지 않아도 멈춘다
    min_term_length: 2

  stock:
    # 이 글자 수 미만의 종목명은 사전에 넣지 않는다.
    # 두 글자 이름은 일반명사와 겹쳐 오탐이 많다
    min_name_length: 3

    # 일반명사와 겹쳐 오탐을 만드는 종목명. 실측으로 채운다
    excludes: []

dart:
  # 조회할 공시 유형(pblntf_ty). 응답에 유형 코드가 없어서 유형별로 나눠 묻는다.
  #   A 정기공시  B 주요사항보고  C 발행공시  D 지분공시  I 거래소공시
  # E 기타·F 외부감사·G 펀드·H 자산유동화·J 공정위는 받지 않는다
  types: [A, B, C, D, I]

  # 시장 구분(corp_cls). Y 유가증권, K 코스닥. 코넥스는 받지 않는다
  markets: [Y, K]

  # 며칠치를 되짚을지. 늦게 올라오는 공시와 배치 결번을 덮는다
  lookback_days: 3

  # 한 쪽에 받을 건수. DART 상한이 100 이다
  page_size: 100

  # 한 번에 넘길 최대 쪽수. 조회 구간이 넓을 때 무한정 돌지 않게 한다
  max_pages: 20
