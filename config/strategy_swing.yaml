# 스윙 추세 추종 전략 파라미터. **전부 임시값이다.**
# 이 값을 찾는 것이 Phase 7 의 본 작업이다 (2026-08-30 확인 사항)

# 진입 — 둘 다 만족할 때
# 오늘 종가가 직전 이 일수의 최고가를 넘는다. 3개월 신고가
breakout_days: 60

# 종가가 이 이평 위에 있다. 6개월 추세가 위를 향한다는 뜻
ma_long: 120

# 청산 — 하나라도 걸리면
# 종가가 이 이평을 밑돌면 추세가 꺾인 것으로 본다.
# 추적 손절을 따로 두지 않는다. 이것이 이미 그 역할이다
ma_exit: 20

# 진입가 대비 손절폭. 이평 이탈은 느려서 갭하락을 못 막는다
stop_loss: 0.07

# 하루 신규 진입 후보 상한. 유니버스 순서(거래대금 상위)대로 채운다
entries_per_day: 5
