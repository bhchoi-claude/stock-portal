# 정보수집 소스. Phase 5 에서 사용한다
#
# kind        'telegram' | 'dart'
# identifier  텔레그램은 채널 숫자 ID, DART 는 'dart'
# weight      신뢰도 가중치. 집계의 weighted_count 에 곱해진다.
#             1.0 이 최댓값이 아니라 기준값이다. 2.0 이면 두 배로 센다.
#             근거가 생기기 전에는 전부 1.0 으로 둔다
#
# 채널 ID 는 `python -m collectors.news.login` 이 찍어준다.
# @사용자명이 아니라 숫자를 쓰는 이유는 두 가지다.
#   - 사용자명은 바뀔 수 있고 숫자 ID 는 바뀌지 않는다
#   - 비공개 채널에는 사용자명이 아예 없다

sources:
  - kind: dart
    identifier: dart
    name: 전자공시 DART
    weight: 1.0
    is_active: true

  # 사용자명 없음 (비공개)
  - kind: telegram
    identifier: "1208429502"
    name: 주식 급등일보 - 급등테마·대장주 탐색기
    weight: 1.0
    is_active: true

  # @corevalue
  - kind: telegram
    identifier: "1217109609"
    name: 가치투자클럽
    weight: 1.0
    is_active: true

