# stock-portal 리버스 프록시. 접속은 Tailscale 로만 들어온다 (PROJECT.md 2장)

server {
    listen 80 default_server;
    server_name _;

    # 인증은 Tailscale 이 처리하므로 앱 로그인을 두지 않는다.
    # 공유기가 이중 NAT 라 포트포워딩이 없고, 이 포트는 밖에서 닿지 않는다
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /lab 은 리치프랜즈랩 자리다. Phase 11 에서 붙인다.
    # 문서가 적어둔 5000 은 kavita 가 쓰고 있어 그때 다시 정해야 한다
}
